[package]
name = "sort_images"
version = "0.1.0"
edition = "2021"

[dependencies]
kamadak-exif = "0.5"
chrono = "0.4"
ureq = { version = "2", features = ["json", "tls"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
open = "5"

[[bin]]
name = "sort_images"
path = "src/main.rs"
